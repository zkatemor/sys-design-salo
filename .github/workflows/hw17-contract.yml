# Контрактные тесты ДЗ-17 (ctrsvc).
# GitHub читает workflows только из .github/workflows/ в КОРНЕ репозитория.
name: hw17-contract

on:
  push:
    branches: [main]
    paths:
      - 'sys-design-salo/hw/17/**'
      - '.github/workflows/hw17-contract.yml'
  pull_request:
    paths:
      - 'sys-design-salo/hw/17/**'
      - '.github/workflows/hw17-contract.yml'

defaults:
  run:
    working-directory: sys-design-salo/hw/17

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: vet
        run: go vet ./...

      - name: unit + race
        run: |
          pkgs=$(go list ./... | grep -v /internal/contract || true)
          if [ -n "$pkgs" ]; then go test -race $pkgs; fi

      - name: contract
        run: go test -race -count=1 -run '^TestContract_' ./internal/contract/...

      - name: openapi-lint
        uses: stoplightio/spectral-action@v0.8.15
        with:
          file_glob: 'api/openapi.yaml'
        env:
          SPECTRAL_RULESET: spectral:oas
