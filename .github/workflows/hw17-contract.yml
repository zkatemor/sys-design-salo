# Контрактные тесты ДЗ-17 (ctrsvc).
# Репозиторий: github.com/zkatemor/sys-design-salo (корень = этот репо).
name: hw17-contract

on:
  push:
    branches: [main, master]
    paths:
      - 'hw/17/**'
      - '.github/workflows/hw17-contract.yml'
  pull_request:
    paths:
      - 'hw/17/**'
      - '.github/workflows/hw17-contract.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: hw/17

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: vet
        run: go vet ./...

      - name: unit + race
        run: |
          pkgs=$(go list ./... | grep -v /internal/contract || true)
          if [ -n "$pkgs" ]; then go test -race $pkgs; fi

      - name: contract
        run: go test -race -count=1 -run '^TestContract_' ./internal/contract/...

      - name: openapi-lint
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'hw/17/api/openapi.yaml'
          spectral_ruleset: spectral:oas
