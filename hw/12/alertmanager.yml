# Фрагмент Alertmanager для travel-platform (учебный пример)

route:
  receiver: slack-warning
  group_by: [alertname, service, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: pagerduty-critical
      continue: true
    - matchers:
        - severity = critical
      receiver: slack-critical

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: <PAGERDUTY_KEY>
        severity: critical
  - name: slack-critical
    slack_configs:
      - channel: "#travel-alerts-critical"
        send_resolved: true
  - name: slack-warning
    slack_configs:
      - channel: "#travel-alerts"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname = SearchHighErrorRate
    target_matchers:
      - alertname = SearchLatencyP99High
    equal: [service, component]
  - source_matchers:
      - alertname = SearchSaturationHigh
    target_matchers:
      - alertname = SearchLatencyP99High
    equal: [service, component]
